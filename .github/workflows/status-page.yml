name: Publish Status Page

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: public-status-page
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore retained uptime history
        run: |
          set +e
          git ls-remote --exit-code origin refs/heads/gh-pages > /dev/null
          lookup_status=$?
          set -e

          case "$lookup_status" in
            0)
              git fetch --depth 1 origin refs/heads/gh-pages
              git show FETCH_HEAD:status/history.json > "$RUNNER_TEMP/status-history.json"
              ;;
            2)
              echo "No existing gh-pages history; starting the first retention window."
              ;;
            *)
              echo "Could not safely restore existing uptime history."
              exit "$lookup_status"
              ;;
          esac

      - name: Check production services and build status page
        env:
          STATUS_PAGE_HISTORY_PATH: ${{ runner.temp }}/status-history.json
        run: bun scripts/build-status-page.ts "${{ runner.temp }}/status-page"

      - name: Retain generated page history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/status-page"
          git init --initial-branch=gh-pages
          git config user.name siv-status-bot
          git config user.email status@siv.chat
          git add --all
          git commit -m "Update public service status"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/status-page

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
